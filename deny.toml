# Configuración de cargo-deny (supply-chain: advisories, licencias, bans,
# fuentes de dependencias).
#
# Corre sobre el workspace principal (Cargo.toml raíz / default-members):
# caudalghost-core, caudalghostd, caudalghost, caudalghost-ebpf-common (y,
# vía el grafo de dependencias de dev/build, caudalghost-ebpf). La GUI
# (crates/caudalghost-gui/src-tauri) es un crate/paquete standalone con su
# propio Cargo.lock (npm + cargo aparte): NO se unifica con este lock ni se
# audita con cargo-deny aquí. Su superficie SÍ se vigila aparte en security.yml:
# cargo-audit sobre su Cargo.lock (informativo — job cargo-audit) + npm audit del
# frontend (job npm-audit-gui). Los advisories transitivos conocidos de esa pila
# (glib y demás, vía Tauri/gtk-rs) se documentan en audit.toml y en SECURITY.md.
#
# ESQUEMA: escrito para cargo-deny 0.19+ (esquema nuevo). El CI instala el mismo
# binario con `cargo install cargo-deny --locked` y corre `cargo deny check`
# (idéntico a local), sin acción de terceros ni el flag `--workspace`, que la
# versión actual ya no acepta. En este esquema las VULNERABILIDADES son error
# (deny) por defecto: no hay que declararlo; solo se lista `ignore` para la
# excepción trackeada.

[graph]
all-features = false
no-default-features = false

[advisories]
# Vulnerabilidades y unsoundness = error por defecto (postura pre-1.0:
# bloquear). Paquetes sin mantenimiento / notices se reportan sin bloquear.
# La excepción glib (RUSTSEC-2024-0429) NO se lista aquí: glib solo vive en el
# Cargo.lock de la GUI (standalone), que se audita en audit.toml; no está en el
# workspace raíz, así que ignorarlo aquí solo generaría ruido "not encountered".
ignore = []

[licenses]
confidence-threshold = 0.8
# Licencias reales del workspace: AGPL-3.0-only (código propio), GPL-2.0-only
# (crate eBPF), MIT (caudalghost-ebpf-common) + las habituales de deps
# transitivas. Unicode-3.0 lo arrastran crates recientes de unicode-ident/icu.
allow = [
    "AGPL-3.0-only",
    "GPL-2.0-only",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
exceptions = [
    # acl-sys (LGPL-2.1) llega vía posix-acl, que usa el daemon para ACLs POSIX.
    # LGPL permite el enlace desde código con otra licencia y es compatible con
    # AGPL-3.0-only. Se acepta SOLO para este crate, no como allow global.
    { crate = "acl-sys", allow = ["LGPL-2.1"] },
]

[bans]
# Postura inicial: avisar sobre versiones múltiples de un mismo crate en el
# árbol (normal con deps grandes tipo aya/tokio); endurecer a "deny" más
# adelante si se decide perseguir duplicados.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
