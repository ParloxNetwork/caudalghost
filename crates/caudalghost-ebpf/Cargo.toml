[package]
name = "caudalghost-ebpf"
version.workspace = true
edition.workspace = true
license = "GPL-2.0-only"

[dependencies]
aya-ebpf.workspace = true
caudalghost-ebpf-common = { path = "../caudalghost-ebpf-common" }

# DESVIACIÓN del plan: el nombre del [[bin]] NO puede coincidir con el nombre del
# paquete. aya-build 0.1.3 usa OUT_DIR/<package> como --target-dir y copia el
# binario a OUT_DIR/<bin>; si ambos se llaman igual, el destino choca con el
# directorio intermedio ("Is a directory"). Lo llamamos "bpf".
[[bin]]
name = "bpf"
path = "src/main.rs"
