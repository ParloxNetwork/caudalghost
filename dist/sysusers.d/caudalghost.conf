# Usuario y grupo de sistema para el daemon de CaudalGhost (F5).
# La línea `u` crea el usuario `caudalghost` y su grupo homónimo. El usuario de
# escritorio se añade a ese grupo (lo hace el paquete) para alcanzar el socket
# 0660 del daemon sin sudo. Sin shell ni home: es una identidad de servicio.
u caudalghost - "CaudalGhost daemon" /nonexistent /usr/sbin/nologin
