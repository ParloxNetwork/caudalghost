# CaudalGhost — edición SERVIDOR · política de acceso al socket
# =============================================================
# Por defecto, la telemetría de red de TODA la máquina queda accesible SOLO a los
# miembros del grupo `caudalghost` (el administrador los añade explícitamente).
# Así, un login SSH cualquiera NO puede ver a qué IPs/dominios se conecta cada app
# de cada usuario del host.
#
#  ⚠  PARA PERMITIR EL ACCESO A TODOS LOS USUARIOS CON SESIÓN  ⚠
#  No edites este archivo (una actualización del paquete lo sobrescribiría). Hazlo
#  de forma INTENCIONAL y persistente con:
#
#      sudo systemctl edit caudalghostd
#
#  y añade —a sabiendas de la implicación de privacidad— el override:
#
#      [Service]
#      Environment=CAUDALGHOST_ACL_ACTIVE_USERS=1
#
#  Implica que CUALQUIER usuario con sesión iniciada podrá leer la telemetría de
#  red de todo el host. El daemon, además, lo deja avisado en su log al arrancar.
#  Recomendado: dejarlo en 0 en servidores multiusuario.
[Service]
Environment=CAUDALGHOST_ACL_ACTIVE_USERS=0
