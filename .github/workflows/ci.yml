name: CI

# CI del workspace de Rust. Dos jobs separados a propósito:
#   - `test`: los crates que compilan para el host sin dependencias eBPF
#     (rápido, fiable, siempre debe pasar en verde).
#   - `daemon-ebpf`: build/test de `caudalghostd`, que dispara build.rs
#     (aya-build) y compila el crate `caudalghost-ebpf` para el target BPF.
#     Necesita toolchain nightly + rust-src + bpf-linker; puede ser más
#     lento y más frágil (ver nota en ese job).
#
# La GUI (crates/caudalghost-gui/src-tauri) tiene su propio Cargo.lock y
# vive fuera de este workspace: no se construye aquí.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + clippy + test (sin eBPF)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Rust stable (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache de cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy (crates sin eBPF)
        run: cargo clippy -p caudalghost-core -p caudalghost --all-targets -- -D warnings

      - name: cargo test (crates sin eBPF)
        run: cargo test -p caudalghost-core -p caudalghost

  daemon-ebpf:
    name: caudalghostd (build+test con toolchain eBPF)
    runs-on: ubuntu-latest
    # INFORMATIVO (no bloquea): compila el crate BPF vía build.rs (aya-build),
    # que usa `rustup run nightly` (Toolchain::default()) + `-Z build-std` y el
    # linker `bpf-linker` (se compila desde cero, ~2 min). aya-build EXIGE el
    # canal `nightly` a secas (no un nightly con nombre de fecha), así que aquí
    # se instala `nightly`, no una fecha pineada. Como aya-build sigue el nightly
    # rolling, un nightly futuro podría romper el build BPF en un día dado, al
    # margen de nuestro código; por eso se mantiene `continue-on-error`. El
    # daemon+eBPF compila en local y es exactamente lo que se empaqueta en la .deb.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # libacl1-dev: el daemon enlaza contra -lacl (vía posix-acl/acl-sys, para
      # las ACLs POSIX del socket). El runner limpio no la trae y el enlace final
      # falla con "unable to find library -lacl". (El job rápido `test` no la
      # necesita: no compila caudalghostd.)
      - name: Instalar libacl (para enlazar el daemon)
        run: sudo apt-get update && sudo apt-get install -y libacl1-dev

      - name: Instalar Rust nightly + rust-src
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache de cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: daemon-ebpf

      - name: Instalar bpf-linker
        run: cargo install bpf-linker

      - name: cargo build -p caudalghostd
        run: cargo build -p caudalghostd

      - name: cargo test -p caudalghostd
        run: cargo test -p caudalghostd
