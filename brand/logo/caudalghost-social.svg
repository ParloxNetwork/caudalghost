<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="CaudalGhost">
  <title>CaudalGhost — avatar social (isotipo sobre fondo agua profunda)</title>
  <!--
    Avatar para redes sociales (LinkedIn, etc.): la gota-centinela (isotipo) grande sobre el fondo oscuro
    "agua profunda", cuadrado completo (sirve para recorte circular y cuadrado). La gota es verbatim de
    app-icon.svg, solo reencuadrada más grande para que se distinga en miniatura.
    Rasterizar a PNG con: rsvg-convert -w 1500 -h 1500 caudalghost-social.svg -o out.png
  -->
  <defs>
    <radialGradient id="cs-bg" cx="42%" cy="30%" r="85%">
      <stop offset="0" stop-color="#11414C"/>
      <stop offset="52%" stop-color="#0A1014"/>
      <stop offset="100%" stop-color="#05080B"/>
    </radialGradient>
    <radialGradient id="cs-body" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#0E7490" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#06222A" stop-opacity="0.40"/>
    </radialGradient>
    <linearGradient id="cs-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <radialGradient id="cs-eye" cx="50%" cy="44%" r="55%">
      <stop offset="0" stop-color="#ECFEFF"/>
      <stop offset="34%" stop-color="#A7F3EE"/>
      <stop offset="70%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#cs-bg)"/>
  <!-- gota-centinela verbatim, reencuadrada grande (drawn ~81% de alto), segura para recorte circular -->
  <g transform="translate(11,-26) scale(4.9)" stroke-linecap="round">
    <path d="M50 15 C53 28 74 50 74 75 a24 25 0 1 1 -48 0 C26 50 47 28 50 15 Z"
          fill="url(#cs-body)" stroke="url(#cs-rim)" stroke-width="2.6"/>
    <path d="M50 15 c5 5 2.5 12 -3.5 13" fill="none" stroke="#67E8F9" stroke-width="2.2" opacity="0.55"/>
    <g stroke="#7DD3FC" stroke-width="1.5" opacity="0.5">
      <line x1="36" y1="88" x2="44" y2="88"/><line x1="56" y1="88" x2="64" y2="88"/>
      <line x1="38" y1="96" x2="44" y2="96"/><line x1="56" y1="96" x2="62" y2="96"/>
    </g>
    <circle cx="50" cy="72" r="16" fill="url(#cs-eye)" opacity="0.9"/>
    <circle cx="50" cy="72" r="9.5" fill="none" stroke="#5EEAD4" stroke-width="1" opacity="0.4"/>
    <circle cx="50" cy="72" r="5" fill="#ECFEFF"/>
    <circle cx="47.6" cy="69.6" r="1.5" fill="#FFFFFF"/>
  </g>
</svg>
