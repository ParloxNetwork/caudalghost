      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#0E7490" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#06222A" stop-opacity="0.30"/>
    </radialGradient>
    <linearGradient id="lk-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/><stop offset="0.5" stop-color="#2DD4BF"/><stop offset="1" stop-color="#0E7490"/>
