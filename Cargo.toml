[workspace]
resolver = "2"
members = [
    "crates/caudalghost-core",
    "crates/caudalghostd",
    "crates/caudalghost",
    "crates/caudalghost-ebpf-common",
    "crates/caudalghost-ebpf",
]
# El crate BPF no compila para el host: se excluye de los comandos por defecto.
default-members = [
    "crates/caudalghost-core",
    "crates/caudalghostd",
    "crates/caudalghost",
    "crates/caudalghost-ebpf-common",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
signal-hook = "0.3"
comfy-table = "7"
owo-colors = { version = "4", features = ["supports-colors"] }
tempfile = "3"
aya = "0.13"
aya-build = "0.1"
aya-ebpf = "0.1"
cargo_metadata = "0.23"
sd-notify = "0.4"
posix-acl = "1.2"
